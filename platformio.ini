[env]
framework = arduino
monitor_speed = 115200

[env:d1_mini]
platform = espressif8266
board = d1_mini
upload_speed = 921600
monitor_filters = esp8266_exception_decoder, default
build_type = debug
board_build.filesystem = littlefs
lib_deps =
  https://github.com/GyverLibs/StringUtils#1.4.29
  https://github.com/GyverLibs/GyverHTTP#1.0.30
  https://github.com/GyverLibs/GyverDB#1.4.3
  https://github.com/GyverLibs/GTL#1.4.2
  https://github.com/GyverLibs/BSON#2.3.4
  https://github.com/GyverLibs/Settings#1.3.16
  https://github.com/GyverLibs/WiFiConnector#1.0.5
  https://github.com/GyverLibs/GyverMAX7219
  https://github.com/GyverLibs/GyverGFX
  